services:
  # ---------- База данных для n8n ----------
  postgres:
    image: postgres:16-alpine
    container_name: n8n-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # ---------- Сам n8n ----------
  n8n:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    # Автоподхват адреса быстрого туннеля Cloudflare:
    #   перед стартом n8n опрашиваем metrics-endpoint cloudflared (/quicktunnel),
    #   получаем текущий https-хост и подставляем его в WEBHOOK_URL.
    #   Так n8n стартует уже с верным адресом и сам регистрирует webhook в Telegram.
    #   Если хост не найден (напр. используется именованный туннель) — берётся WEBHOOK_URL из .env.
    entrypoint:
      - tini
      - --
      - /bin/sh
      - -c
      - |
        CF="http://cloudflared:2000/quicktunnel";
        echo "n8n: ожидание адреса быстрого туннеля Cloudflare...";
        for i in $$(seq 1 60); do
          H=$$(wget -qO- "$$CF" 2>/dev/null | sed -n 's/.*"hostname":"\([^"]*\)".*/\1/p');
          if [ -n "$$H" ]; then
            export WEBHOOK_URL="https://$$H";
            export N8N_WEBHOOK_URL="https://$$H";
            export N8N_EDITOR_BASE_URL="https://$$H";
            echo "n8n: адрес туннеля = $$WEBHOOK_URL";
            break;
          fi;
          sleep 2;
        done;
        if [ -z "$$H" ]; then echo "n8n: адрес туннеля не получен, использую WEBHOOK_URL из окружения ($$WEBHOOK_URL)"; fi;
        exec /docker-entrypoint.sh
    environment:
      # --- Подключение к БД ---
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}

      # --- Сеть / доступ ---
      - N8N_HOST=${N8N_HOST}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL}
      # Публичный URL (туннель), нужен для вебхуков Telegram
      - WEBHOOK_URL=${WEBHOOK_URL}
      - N8N_EDITOR_BASE_URL=${WEBHOOK_URL}

      # --- Безопасность входа в редактор n8n ---
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}

      # --- Таймзона ---
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - TZ=${GENERIC_TIMEZONE}

      # --- Разрешаем чтение переменных окружения в Code-нодах ($env) ---
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false

      # --- Автоочистка старых логов выполнения (экономия места в БД) ---
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      - EXECUTIONS_DATA_PRUNE_MAX_COUNT=1000

      # --- Прочее ---
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_RUNNERS_ENABLED=true

      # --- Доступ к Postgres из Code-нод (модуль pg) ---
      # Разрешаем подключать внешний модуль pg и указываем путь к node_modules n8n
      - NODE_FUNCTION_ALLOW_EXTERNAL=pg
      - NODE_PATH=/usr/local/lib/node_modules/n8n/node_modules
      # Параметры подключения (библиотека pg читает их автоматически)
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=${POSTGRES_USER}
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - PGDATABASE=${POSTGRES_DB}

      # --- Секреты, которые читают Code-ноды воркфлоу через $env ---
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL}
      - IG_USER_ID=${IG_USER_ID}
      - IG_ACCESS_TOKEN=${IG_ACCESS_TOKEN}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows
    depends_on:
      postgres:
        condition: service_healthy
      cloudflared:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 2G

  # ---------- Cloudflare Tunnel: публичный HTTPS-адрес для n8n ----------
  # РЕЖИМ 1 (сейчас активен) — БЫСТРЫЙ туннель без домена и без токена.
  #   Даёт бесплатный HTTPS-адрес вида https://xxxxx.trycloudflare.com.
  #   Адрес меняется при каждом перезапуске — берите его из:
  #     docker compose logs cloudflared
  #   и вписывайте в WEBHOOK_URL, затем выкл/вкл Active у воркфлоу.
  #
  # РЕЖИМ 2 — ИМЕНОВАННЫЙ туннель (стабильный адрес, нужен свой домен в Cloudflare).
  #   Закомментируйте строку command ниже и раскомментируйте вариант с --token,
  #   заполнив CLOUDFLARE_TUNNEL_TOKEN в .env.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: n8n-tunnel
    restart: unless-stopped
    # --metrics поднимает служебный HTTP-порт 2000 с эндпоинтом /quicktunnel,
    # откуда n8n автоматически забирает сгенерированный адрес *.trycloudflare.com.
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 --url http://n8n:5678
    # command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    # ВАЖНО: cloudflared больше НЕ зависит от n8n (иначе циклическая зависимость).
    # Порядок теперь обратный: n8n ждёт cloudflared, чтобы узнать адрес туннеля.

volumes:
  postgres_data:
  n8n_data:
